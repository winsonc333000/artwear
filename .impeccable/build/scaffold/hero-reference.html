<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: draft-c-wall.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f6f6f6}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1024px">
  <div class="r-wordmark region text" data-region="wordmark"><!-- ARTwear wordmark in high-contrast serif --><p style="font-size:var(--r-wordmark-font);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav region control" data-region="nav"><!-- nav links Shop Artists Drop About Bag (0) in grotesk: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav); a control need not have button chrome --></div>
  <div class="r-headline region text" data-region="headline"><!-- large high-contrast serif headline, two lines (to read: Authentic artist worn clothes) --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <figure class="r-hero-coat region plate" data-region="hero-coat"><img src="../../../assets/plates/hero-coat.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-label-card region chrome" data-region="label-card"><!-- white wall label card with four corner pins and soft shadow --></div>
  <div class="r-label-text region text" data-region="label-text"><!-- wall label text: artist name bold, garment and weeks worn, media, number and 1 of 1 --><p style="font-size:var(--r-label-text-font);line-height:1.05;margin:0">label-text</p></div>
  <div class="r-label-add region control" data-region="label-add"><!-- black Add to bag button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop label-add); a control need not have button chrome --></div>
  <div class="r-tabs region control" data-region="tabs"><!-- category tabs All (underlined) Tops Bottoms Outerwear Aprons: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop tabs); a control need not have button chrome --></div>
  <figure class="r-tile-1 region plate" data-region="tile-1"><img src="../../../assets/plates/tile-1.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <figure class="r-tile-2 region plate" data-region="tile-2"><img src="../../../assets/plates/tile-2.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <figure class="r-tile-3 region plate" data-region="tile-3"><img src="../../../assets/plates/tile-3.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-sold-dot region control" data-region="sold-dot"><!-- black round Sold badge: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop sold-dot); a control need not have button chrome --></div>
  <figure class="r-tile-4 region plate" data-region="tile-4"><img src="../../../assets/plates/tile-4.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <figure class="r-tile-5 region plate" data-region="tile-5"><img src="../../../assets/plates/tile-5.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-cap-1 region text" data-region="cap-1"><!-- catalog caption No. 028 artist garment media 1 of 1 --><p style="font-size:var(--r-cap-1-font);line-height:1.05;margin:0">cap-1</p></div>
  <div class="r-cap-2 region text" data-region="cap-2"><!-- catalog caption No. 029 --><p style="font-size:var(--r-cap-2-font);line-height:1.05;margin:0">cap-2</p></div>
  <div class="r-cap-3 region text" data-region="cap-3"><!-- catalog caption No. 030 --><p style="font-size:var(--r-cap-3-font);line-height:1.05;margin:0">cap-3</p></div>
  <div class="r-cap-4 region text" data-region="cap-4"><!-- catalog caption No. 031 --><p style="font-size:var(--r-cap-4-font);line-height:1.05;margin:0">cap-4</p></div>
  <div class="r-cap-5 region text" data-region="cap-5"><!-- catalog caption No. 032 --><p style="font-size:var(--r-cap-5-font);line-height:1.05;margin:0">cap-5</p></div>
</main>
</body>
</html>
